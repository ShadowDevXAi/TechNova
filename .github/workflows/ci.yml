name: TechNova checks

on:
  push:
    branches:
      - main
      - codex/technova-role-based-ids
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Backend syntax and frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app
      - name: Import API and validate route configuration
        working-directory: backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/technova_ci
          JWT_SECRET: technova-ci-only-secret-key-with-more-than-32-characters
          BOOTSTRAP_FOUNDER_NAME: CI Founder
          BOOTSTRAP_FOUNDER_EMAIL: ci-founder@example.com
          BOOTSTRAP_FOUNDER_PASSWORD: ci-only-not-a-real-password-123
        run: |
          python -c "from app.main import app; from app.routes.hub import HUB_COLLECTIONS, HUB_STAFF; expected = {'projects', 'challenges', 'events', 'resources', 'discussions', 'rewards', 'attendance', 'polls', 'mentorship', 'messages', 'certificates'}; assert set(HUB_COLLECTIONS) == expected; assert {'Founder', 'Core Management', 'Faculty'} == HUB_STAFF; from app.routes.push import router as push_router; assert any(route.path == '/api/push/register' for route in push_router.routes); from app.core import member_level_details; assert member_level_details(0)['level_title'] == 'Newcomer'; assert member_level_details(100)['level'] == 2; assert member_level_details(400)['level_title'] == 'Contributor'; assert member_level_details(10000)['level_title'] == 'TechNova Legend'; assert member_level_details(12100)['level'] == 12; print('API imports, Hub configuration and XP progression are valid.')"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
