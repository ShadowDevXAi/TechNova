name: TechNova checks

on:
  push:
    branches:
      - main
      - codex/technova-role-based-ids
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Backend syntax and frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app
      - name: Import API and validate route configuration
        working-directory: backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/technova_ci
          JWT_SECRET: technova-ci-only-secret-key-with-more-than-32-characters
          BOOTSTRAP_FOUNDER_NAME: CI Founder
          BOOTSTRAP_FOUNDER_EMAIL: ci-founder@example.com
          BOOTSTRAP_FOUNDER_PASSWORD: ci-only-not-a-real-password-123
          SMTP_HOST: ""
          SMTP_FROM_EMAIL: ""
        run: |
          python - <<'PY'
          from bson import ObjectId
          from datetime import datetime, timezone
          from app.main import app
          from app.routes.hub import HUB_COLLECTIONS, HUB_STAFF
          from app.routes.push import router as push_router
          from app.routes.system import router as system_router
          from app.db import partial_object_id_index_is_current
          from app.routes.auth import router as auth_router
          from app.core import (
              build_auto_archive_age_query,
              clean_task,
              founder_progression_details,
              member_level_details,
              smtp_configuration_status,
              build_task_email_summary,
              build_task_sms_summary,
          )

          expected_hub = {
              "projects", "challenges", "events", "resources", "discussions",
              "rewards", "attendance", "polls", "mentorship", "messages",
              "certificates",
          }
          assert set(HUB_COLLECTIONS) == expected_hub, "Hub collection set"
          assert HUB_STAFF == {"Founder", "Core Management", "Faculty"}, "Hub staff roles"
          assert any(route.path == "/api/push/register" for route in push_router.routes), "Push registration route"
          assert any(route.path == "/api/health" for route in system_router.routes), "Health route"
          assert any(route.path == "/api/auto-tasks/archive-now" for route in system_router.routes), "Manual auto-archive route"
          assert any(route.path == "/api/admin/email/status" for route in system_router.routes), "SMTP status route"
          assert any(route.path == "/api/admin/email/test" for route in system_router.routes), "SMTP test route"
          assert any(route.path == "/api/admin/storage/status" for route in system_router.routes), "Storage diagnostics route"
          auth_paths = {route.path for route in auth_router.routes}
          assert "/api/auth/2fa/setup" in auth_paths and "/api/auth/2fa/enable" in auth_paths, "Management MFA enrollment routes"
          assert "/api/auth/2fa/login" in auth_paths and "/api/auth/2fa/status" in auth_paths, "Management MFA login/status routes"
          assert "/api/auth/2fa/devices" in auth_paths, "Trusted-device route"
          from app.security import create_access_token, decode_access_token
          assert decode_access_token(create_access_token("ci-user", "Founder", mfa_verified=True))["mfa_verified"] is True, "MFA must be explicit in management JWTs"
          email_test_source = open("app/routes/system.py", encoding="utf-8").read()
          assert "Transactional email permission to All" in email_test_source, "Actionable Brevo permission error guidance"

          smtp_status = smtp_configuration_status()
          assert "password" not in smtp_status and "username" not in smtp_status, "SMTP credentials must never be returned"
          assert "api_key" not in smtp_status and "brevo_api_key" not in smtp_status, "Email API credentials must never be returned"
          auth_source = open("app/routes/auth.py", encoding="utf-8").read()
          member_source = open("app/routes/members.py", encoding="utf-8").read()
          task_source = open("app/routes/tasks.py", encoding="utf-8").read()
          core_source = open("app/core.py", encoding="utf-8").read()
          assert "registration_received" in auth_source and "registration_pending" in auth_source, "Registration email notifications"
          assert "smtp_configuration_status()" in auth_source, "Password resets must support HTTPS email providers"
          assert "account_approved" in member_source and "account_suspended" in member_source, "Member lifecycle email notifications"
          assert "task_comment" in task_source, "Task comments must notify the other party"
          assert 'await create_notification(\n                recipient,\n                "New comment on an assigned task"' not in task_source, "Member task-comment emails must use the task summary"
          assert "build_task_email_summary" in core_source, "Task email detail summary helper"
          app_source = open("../frontend/src/App.jsx", encoding="utf-8").read()
          assert "completeTwoFactorSetup" in app_source and "QRCodeSVG" in app_source, "Management authenticator enrollment UI"
          assert "TwoFactorSettings" in app_source, "Trusted-device security settings UI"
          assert "build_task_sms_summary" in core_source, "Compact task SMS summary helper"
          from app.storage import attachment_storage_status
          from app.routes.tasks import attachment_signature_is_valid
          local_storage = attachment_storage_status()
          assert local_storage["provider"] == "Local disk" and local_storage["configured"], "Local development storage fallback"
          assert attachment_signature_is_valid("image/png", b"\\x89PNG\\r\\n\\x1a\\nexample"), "PNG file signature"
          assert not attachment_signature_is_valid("image/png", b"not an image"), "Reject MIME spoofing"
          assert attachment_signature_is_valid("application/pdf", b"%PDF-1.7"), "PDF file signature"
          assert not attachment_signature_is_valid("application/zip", b"#!/bin/sh"), "Reject executable renamed as ZIP"
          assert "create_task_notification" in task_source, "Task event emails use full task summary"
          sample_summary = {
              "title": "Calculate total marks", "description": "Read 5 subject marks and calculate the sum.",
              "project": "C Programming", "priority": "Medium", "difficulty_rank": "F",
              "credits_reward": 5, "programming_language": "C", "due_date": "2026-11-02",
              "status": "Todo", "recurrence": "once",
          }
          full_task_email = build_task_email_summary(sample_summary, "A new task was assigned.")
          assert "Read 5 subject marks" in full_task_email and "Programming language: C" in full_task_email, "Full task email includes description and language"
          compact_task_sms = build_task_sms_summary(sample_summary, "New task assigned")
          assert len(compact_task_sms) <= 320 and "Calculate total marks" in compact_task_sms, "SMS summary stays compact"
          assert "penalty_recipient = await db.users.find_one" in core_source, "Penalty emails must load the actual member email"

          archive_cutoff = datetime(2026, 1, 1, tzinfo=timezone.utc)
          archive_query = build_auto_archive_age_query("completion_confirmed_at", archive_cutoff)
          assert archive_query["$or"][0] == {"completion_confirmed_at": {"$lte": archive_cutoff}}, "Completed task retention cutoff"
          assert archive_query["$or"][1]["updated_at"] == {"$lte": archive_cutoff}, "Legacy completion timestamp fallback"

          valid_index = {
              "unique": True,
              "partialFilterExpression": {"daily_schedule_id": {"$type": "objectId"}},
          }
          old_index = {
              "unique": True,
              "partialFilterExpression": {"daily_schedule_id": {"$exists": True}},
          }
          assert partial_object_id_index_is_current(valid_index, "daily_schedule_id"), "Correct ObjectId partial index"
          assert not partial_object_id_index_is_current(old_index, "daily_schedule_id"), "Legacy $exists index must be migrated"

          legacy_task = clean_task({
              "_id": ObjectId(), "status": "Todo",
              "assignment_group_id": ObjectId(),
          })
          assert legacy_task["title"] == "Untitled task", "Legacy task title fallback"
          assert legacy_task["assignee_id"] == "", "Legacy assignee fallback"
          assert legacy_task["created_by"] == "", "Legacy creator fallback"
          assert isinstance(legacy_task["assignment_group_id"], str), "ObjectId JSON conversion"

          assert member_level_details(0)["level_title"] == "Newcomer", "Level 1"
          assert member_level_details(100)["level"] == 2, "Level 2"
          assert member_level_details(400)["level_title"] == "Contributor", "Contributor title"
          assert member_level_details(10000)["level_title"] == "TechNova Legend", "Legend title"
          assert member_level_details(12100)["level"] == 12, "Open-ended XP levels"

          founder = founder_progression_details(3, 1, 50)
          assert founder["progression_type"] == "founder", "Founder progression mode"
          assert founder["level"] is None and founder["xp"] is None, "Founder is not XP-ranked"
          assert founder["level_title"] == "Founder · Origin Rank", "Permanent Founder title"

          print("API imports, task serializer, schedule index migration, Hub, push, health and progression checks passed.")
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify Firebase browser and worker share the configured Web App key
        working-directory: frontend
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const page = fs.readFileSync("src/firebase.js", "utf8");
          const worker = fs.readFileSync("public/firebase-messaging-sw.js", "utf8");
          if (!page.includes("VITE_FIREBASE_API_KEY")) throw new Error("Frontend Firebase API key must come from VITE_FIREBASE_API_KEY");
          if (!page.includes('searchParams.set("firebaseConfig"')) throw new Error("Page must pass its Firebase config to the service worker");
          if (!worker.includes('searchParams.get("firebaseConfig")')) throw new Error("Service worker must read the page-provided Firebase config");
          if (worker.includes("AIzaSy")) throw new Error("Do not hard-code a Firebase API key in the service worker");
          console.log("Firebase browser and service-worker configuration checks passed.");
          NODE
      - name: Build frontend
        working-directory: frontend
        run: npm run build
